[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netcoop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "fastapi",
    "uvicorn",
    "networkx",
    "google-genai",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]
mcp = ["mcp>=2"]

[tool.setuptools.packages.find]
include = ["netcoop*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["performance: dense telemetry performance regression (runs by default)"]
